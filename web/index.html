<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日程調整</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2f5f2; --surface: #ffffff; --ink: #14201b; --muted: #5d6b63; --rule: #d3dbd5;
    --line: #06c755; --line-ink: #04391c;
    --yes: #0a8f4e; --maybe: #b57b00; --no: #b4483c;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font: 500 16px/1.7 "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 26px; line-height: 1.3; margin: 8px 0 4px; font-weight: 700; letter-spacing: .01em; }
  h2 { font-size: 17px; margin: 28px 0 8px; font-weight: 700; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  label { display: block; font-weight: 700; font-size: 14px; margin: 16px 0 4px; }
  input, textarea, select { width: 100%; font: inherit; padding: 10px 12px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
    outline: 3px solid var(--line); outline-offset: 2px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--rule);
    background: var(--surface); color: var(--ink); padding: 10px 14px; }
  button.primary { background: var(--line); border-color: var(--line); color: var(--line-ink); font-weight: 700; width: 100%; padding: 14px; margin-top: 24px; }
  button.ghost { color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  .cand-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .cand-row input { flex: 1; }
  .notice { padding: 12px 14px; border-left: 4px solid var(--line); background: var(--surface); margin: 16px 0; }
  .error { border-left-color: var(--no); color: var(--no); }
  .hint { color: var(--muted); font-size: 14px; }
  .slot { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .slot.confirmed { border: 2px solid var(--line); }
  .slot-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .slot-date { font-weight: 700; font-size: 18px; }
  .tally { font-size: 14px; color: var(--muted); }
  .tally b { color: var(--ink); }
  .names { font-size: 14px; margin-top: 6px; }
  .names span { margin-right: 10px; display: inline-block; }
  .note { color: var(--muted); font-size: 13px; margin-left: 2px; }
  .note-in { margin-top: 8px; font-size: 14px; padding: 8px 10px; }
  .loc { margin: 0 0 12px; word-break: break-all; }
  .loc a { color: inherit; }
  button.wide { width: 100%; margin-top: 12px; }
  button.danger { width: 100%; border-color: var(--no); color: var(--no); font-weight: 700; margin-top: 8px; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .check input { width: auto; }
  .cand-row.existing { align-items: center; justify-content: space-between; background: var(--surface);
    border: 1px solid var(--rule); border-radius: 6px; padding: 6px 6px 6px 12px; }
  .cand-row.removed .cand-label { text-decoration: line-through; color: var(--muted); }
  details.roster { margin-top: 28px; border-top: 1px solid var(--rule); padding-top: 12px; }
  details.roster summary { cursor: pointer; font-weight: 700; }
  details.roster textarea { margin-top: 8px; }
  details.roster button { margin-top: 8px; }
  .y { color: var(--yes); } .m { color: var(--maybe); } .n { color: var(--no); }
  .choice { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .choice button { padding: 10px 0; font-weight: 700; }
  .choice button[aria-pressed="true"][data-v="2"] { background: var(--yes); border-color: var(--yes); color: #fff; }
  .choice button[aria-pressed="true"][data-v="1"] { background: var(--maybe); border-color: var(--maybe); color: #fff; }
  .choice button[aria-pressed="true"][data-v="0"] { background: var(--no); border-color: var(--no); color: #fff; }
  .confirm-btn { margin-top: 10px; width: 100%; border-color: var(--line); color: var(--line-ink); background: #e6f9ee; font-weight: 700; }
  .linkbox { word-break: break-all; font-size: 14px; background: var(--surface); border: 1px solid var(--rule); padding: 10px; border-radius: 6px; margin: 6px 0 10px; }
  @media (prefers-reduced-motion: no-preference) { button { transition: background-color .15s; } }
</style>
</head>
<body>
<main id="app"><p class="hint">読み込み中…</p></main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
// 設定は config.js(ローカルは config.example.js をコピー、本番は GitHub Actions が生成)から読み込む
const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG || {};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const MARK = { 2: "○", 1: "△", 0: "×" };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (iso) => new Date(iso).toLocaleString("ja-JP", { month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" });
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

// http(s) の URL だけをリンクにする(それ以外は文字として表示)
const linkify = (s) => /^https?:\/\/\S+$/.test(s)
  ? `<a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(s)}</a>` : esc(s);
const toLocalInput = (iso) => {
  const d = new Date(iso), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};

async function api(body) {
  const { data, error } = await sb.functions.invoke("schedule-api", { body });
  if (error) {
    let msg = error.message;
    try { msg = (await error.context.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  return data;
}

/* ---------- 新規作成 ---------- */
async function renderCreate() {
  const token = params.get("g");
  if (!token) {
    app.innerHTML = `<h1>日程調整</h1>
      <div class="notice">日程調整を作るには、LINEグループ専用のURLが必要です。Botを招待したグループで「登録」と発言すると、専用URLが届きます。</div>`;
    return;
  }
  let group;
  try { group = await api({ action: "get_group", create_token: token }); }
  catch (err) { app.innerHTML = `<h1>日程調整</h1><div class="notice error">${esc(err.message)}</div>`; return; }
  app.innerHTML = `
    <h1>日程調整を作る</h1>
    <p class="sub">作成すると、LINEグループ${group.name ? `「${esc(group.name)}」` : ""}に回答用リンクが届きます。</p>
    <label for="title">イベント名</label><input id="title" placeholder="例: 11月の定例ミーティング">
    <label for="desc">メモ(任意)</label><textarea id="desc" rows="2"></textarea>
    <label for="loc">場所・URL(任意)</label><input id="loc" maxlength="200" placeholder="例: 会議室A / https://meet.google.com/...">
    <label for="org">幹事の名前</label><input id="org" value="${esc(store.get("name") || "")}">
    <label>候補日時</label>
    <div id="cands"></div>
    <button type="button" id="add">候補を追加</button>
    <label for="deadline">回答期限(任意・24時間前にリマインドが届きます)</label>
    <input id="deadline" type="datetime-local">
    <div id="msg"></div>
    <button class="primary" id="go">作成してLINEに通知する</button>
    <details class="roster">
      <summary>メンバー名簿(任意)</summary>
      <p class="hint">名簿を登録すると、回答期限のリマインドで未回答の方を名指しし、全員(幹事を除く)が回答したら幹事宛にお知らせします。1行に1人、回答時に入力する名前と同じ表記で入れてください。幹事の名前が入っていても構いません。</p>
      <textarea id="members" rows="6" placeholder="田中&#10;佐藤&#10;鈴木">${esc((group.members || []).join("\n"))}</textarea>
      <button type="button" id="save-members">名簿を保存する</button>
      <div id="members-msg" role="status"></div>
    </details>`;

  const cands = document.getElementById("cands");
  const addRow = () => {
    const row = document.createElement("div");
    row.className = "cand-row";
    row.innerHTML = `<input type="datetime-local" aria-label="候補日時"><button type="button" class="ghost" aria-label="この候補を削除">削除</button>`;
    row.querySelector("button").onclick = () => cands.children.length > 1 && row.remove();
    cands.appendChild(row);
  };
  addRow(); addRow();
  document.getElementById("add").onclick = addRow;

  document.getElementById("save-members").onclick = async (e) => {
    const out = document.getElementById("members-msg");
    e.target.disabled = true;
    try {
      const members = document.getElementById("members").value.split("\n");
      const r = await api({ action: "set_members", create_token: token, members });
      document.getElementById("members").value = r.members.join("\n");
      out.innerHTML = `<div class="notice">${r.members.length}名の名簿を保存しました。</div>`;
    } catch (err) {
      out.innerHTML = `<div class="notice error">${esc(err.message)}</div>`;
    }
    e.target.disabled = false;
  };

  document.getElementById("go").onclick = async (e) => {
    const btn = e.target, msg = document.getElementById("msg");
    const val = (id) => document.getElementById(id).value.trim();
    const candidates = [...cands.querySelectorAll("input")].map((i) => i.value).filter(Boolean).map((v) => new Date(v).toISOString());
    btn.disabled = true; msg.innerHTML = "";
    try {
      const r = await api({
        action: "create_event", title: val("title"), description: val("desc"), location: val("loc"), organizer: val("org"),
        create_token: token,
        deadline: val("deadline") ? new Date(val("deadline")).toISOString() : null, candidates,
      });
      store.set("name", val("org"));
      store.set("admin:" + r.event_id, r.admin_token);
      location.href = `?e=${r.event_id}&created=1`;
    } catch (err) {
      msg.innerHTML = `<div class="notice error">${esc(err.message)}</div>`;
      btn.disabled = false;
    }
  };
}

/* ---------- 回答・確認 ---------- */
async function renderEvent(id) {
  const { event: ev, candidates: cands, responses: rs, members = [] } = await api({ action: "get_event", event_id: id }).catch(() => ({}));
  if (!ev) { app.innerHTML = `<h1>イベントが見つかりません</h1><p class="sub">リンクをもう一度確認してください。</p>`; return; }

  const adminToken = params.get("a") || store.get("admin:" + id);
  const confirmed = ev.status === "confirmed";
  const myName = store.get("name") || "";
  const mine = {};
  const byCand = {};
  (rs || []).forEach((r) => { (byCand[r.candidate_id] ||= []).push(r); });

  const slotHtml = (c) => {
    const list = byCand[c.id] || [];
    const grp = (v) => list.filter((r) => r.answer === v);
    const who = (cls, mark) => (r) => `<span class="${cls}">${mark} ${esc(r.name)}${r.note ? `<small class="note">(${esc(r.note)})</small>` : ""}</span>`;
    const isConfirmed = ev.confirmed_candidate_id === c.id;
    return `<div class="slot ${isConfirmed ? "confirmed" : ""}" data-c="${c.id}">
      <div class="slot-head">
        <span class="slot-date">${esc(fmt(c.starts_at))}${isConfirmed ? "　確定" : ""}</span>
        <span class="tally"><b class="y">○ ${grp(2).length}</b>　<b class="m">△ ${grp(1).length}</b>　<b class="n">× ${grp(0).length}</b></span>
      </div>
      <div class="names">
        ${grp(2).map(who("y", "○")).join("")}
        ${grp(1).map(who("m", "△")).join("")}
        ${grp(0).map(who("n", "×")).join("")}
      </div>
      ${confirmed ? "" : `<div class="choice" role="group" aria-label="${esc(fmt(c.starts_at))}の回答">
        ${[2, 1, 0].map((v) => `<button type="button" data-v="${v}" aria-pressed="false">${MARK[v]}</button>`).join("")}</div>
        <input type="text" class="note-in" maxlength="60" hidden placeholder="備考(例: 19時までなら参加できます)" aria-label="${esc(fmt(c.starts_at))}の備考">`}
      ${adminToken && !confirmed ? `<button type="button" class="confirm-btn" data-confirm="${c.id}">この日で確定する</button>` : ""}
    </div>`;
  };

  app.innerHTML = `
    <h1>${esc(ev.title)}</h1>
    <p class="sub">幹事: ${esc(ev.organizer)}${ev.deadline ? `　回答期限: ${esc(fmt(ev.deadline))}` : ""}</p>
    ${ev.location ? `<p class="loc">📍 場所・URL: ${linkify(ev.location)}</p>` : ""}
    ${ev.description ? `<p>${esc(ev.description)}</p>` : ""}
    ${adminToken ? `<button type="button" class="wide" id="edit-open">イベントを編集・削除する</button>` : ""}
    ${params.get("created") ? `<div class="notice">LINEグループに通知しました。${adminToken ? "このブラウザで確定操作ができます。幹事用リンクを控えておくと、別の端末からも確定できます。" : ""}
      ${adminToken ? `<div class="linkbox">${esc(location.origin + location.pathname)}?e=${id}&amp;a=${esc(adminToken)}</div>` : ""}</div>` : ""}
    ${confirmed ? `<div class="notice">日程は確定しました。</div>` : `
      <label for="name">あなたの名前</label><input id="name" value="${esc(myName)}" autocomplete="name" list="member-list" maxlength="30">
      <datalist id="member-list">${members.map((m) => `<option value="${esc(m)}">`).join("")}</datalist>`}
    <h2>${confirmed ? "確定した日程" : "候補日時"}</h2>
    ${(cands || []).map(slotHtml).join("")}
    <div id="msg"></div>
    ${confirmed ? "" : `<button class="primary" id="send">回答を送信する</button>`}`;

  const eo = document.getElementById("edit-open");
  if (eo) eo.onclick = () => renderEdit(id, adminToken);

  if (confirmed) return;

  const pick = (cid, v, note) => {
    mine[cid] = { answer: v, note: note ?? mine[cid]?.note ?? "" };
    const slot = app.querySelector(`.slot[data-c="${cid}"]`);
    slot.querySelectorAll(".choice button").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.v) === v)));
    const ni = slot.querySelector(".note-in");
    ni.hidden = false;
    if (note !== undefined) ni.value = note;
  };
  const preload = (name) => (rs || []).filter((r) => r.name === name.trim()).forEach((r) => pick(r.candidate_id, r.answer, r.note || ""));
  app.querySelectorAll(".note-in").forEach((i) => i.addEventListener("input", () => {
    const c = i.closest(".slot").dataset.c;
    if (mine[c]) mine[c].note = i.value;
  }));
  if (myName) preload(myName);
  document.getElementById("name").addEventListener("change", (e) => preload(e.target.value));
  app.querySelectorAll(".choice button").forEach((b) => b.onclick = () => pick(b.closest(".slot").dataset.c, Number(b.dataset.v)));

  const msg = document.getElementById("msg");
  document.getElementById("send").onclick = async (e) => {
    const name = document.getElementById("name").value.trim();
    if (!name) { msg.innerHTML = `<div class="notice error">名前を入力してください。</div>`; return; }
    if (!Object.keys(mine).length) { msg.innerHTML = `<div class="notice error">1つ以上の候補に回答してください。</div>`; return; }
    e.target.disabled = true;
    try {
      await api({ action: "respond", event_id: id, name, answers: mine });
      store.set("name", name);
      params.delete("created");
      renderEvent(id);
    } catch (err) {
      msg.innerHTML = `<div class="notice error">${esc(err.message)}</div>`;
      e.target.disabled = false;
    }
  };

  app.querySelectorAll("[data-confirm]").forEach((b) => b.onclick = async () => {
    if (!confirm("この日程で確定し、LINEグループに通知します。よろしいですか?")) return;
    b.disabled = true;
    try {
      await api({ action: "confirm", event_id: id, admin_token: adminToken, candidate_id: b.dataset.confirm });
      renderEvent(id);
    } catch (err) {
      msg.innerHTML = `<div class="notice error">${esc(err.message)}</div>`;
      b.disabled = false;
    }
  });
}

/* ---------- 幹事: 編集・削除 ---------- */
async function renderEdit(id, adminToken) {
  const { event: ev, candidates: cands } = await api({ action: "get_event", event_id: id });
  const confirmed = ev.status === "confirmed";
  const removed = new Set();
  app.innerHTML = `
    <h1>イベントを編集</h1>
    <p class="sub">${esc(ev.title)}</p>
    ${confirmed ? `<div class="notice">確定済みのため、候補日時と回答期限は変更できません。</div>` : ""}
    <label for="e-title">イベント名</label><input id="e-title" value="${esc(ev.title)}" maxlength="100">
    <label for="e-desc">メモ</label><textarea id="e-desc" rows="2" maxlength="500">${esc(ev.description || "")}</textarea>
    <label for="e-loc">場所・URL</label><input id="e-loc" value="${esc(ev.location || "")}" maxlength="200">
    ${confirmed ? "" : `
      <label>候補日時</label>
      <div id="e-cands">${cands.map((c) => `<div class="cand-row existing" data-id="${c.id}"><span class="cand-label">${esc(fmt(c.starts_at))}</span><button type="button" class="ghost" data-toggle="${c.id}">取り下げ</button></div>`).join("")}</div>
      <p class="hint">取り下げた候補への回答は削除されます。</p>
      <div id="e-new"></div>
      <button type="button" id="e-add">候補を追加</button>
      <label for="e-deadline">回答期限(変更するとリマインドもやり直されます)</label>
      <input id="e-deadline" type="datetime-local" value="${ev.deadline ? toLocalInput(ev.deadline) : ""}">`}
    <label class="check" style="margin-top:20px"><input type="checkbox" id="e-notify" checked>変更内容をLINEグループに通知する</label>
    <div id="msg" role="status"></div>
    <button class="primary" id="e-save">変更を保存する</button>
    <button type="button" class="wide" id="e-back">編集をやめて戻る</button>
    <h2>イベントの削除</h2>
    <p class="hint">イベントと回答がすべて削除され、LINEグループに中止をお知らせします。元に戻せません。</p>
    <button type="button" class="danger" id="e-delete">このイベントを削除する</button>`;

  const msg = document.getElementById("msg");
  const val = (i) => document.getElementById(i).value.trim();
  document.getElementById("e-back").onclick = () => renderEvent(id);

  if (!confirmed) {
    app.querySelectorAll("[data-toggle]").forEach((b) => b.onclick = () => {
      const cid = b.dataset.toggle, row = b.closest(".cand-row");
      if (removed.has(cid)) { removed.delete(cid); row.classList.remove("removed"); b.textContent = "取り下げ"; }
      else { removed.add(cid); row.classList.add("removed"); b.textContent = "取り下げを取消"; }
    });
    const box = document.getElementById("e-new");
    document.getElementById("e-add").onclick = () => {
      const row = document.createElement("div");
      row.className = "cand-row";
      row.innerHTML = `<input type="datetime-local" aria-label="追加する候補日時"><button type="button" class="ghost" aria-label="この候補を削除">削除</button>`;
      row.querySelector("button").onclick = () => row.remove();
      box.appendChild(row);
    };
  }

  document.getElementById("e-save").onclick = async (e) => {
    e.target.disabled = true; msg.innerHTML = "";
    const body = {
      action: "update_event", event_id: id, admin_token: adminToken,
      title: val("e-title"), description: val("e-desc"), location: val("e-loc"),
      notify: document.getElementById("e-notify").checked,
    };
    if (!confirmed) {
      body.deadline = val("e-deadline") ? new Date(val("e-deadline")).toISOString() : null;
      body.add_candidates = [...document.querySelectorAll("#e-new input")].map((i) => i.value).filter(Boolean).map((v) => new Date(v).toISOString());
      body.remove_candidate_ids = [...removed];
    }
    try { await api(body); renderEvent(id); }
    catch (err) { msg.innerHTML = `<div class="notice error">${esc(err.message)}</div>`; e.target.disabled = false; }
  };

  document.getElementById("e-delete").onclick = async (e) => {
    if (!confirm("このイベントを削除し、LINEグループに中止を通知します。元に戻せません。よろしいですか?")) return;
    e.target.disabled = true;
    try {
      await api({ action: "delete_event", event_id: id, admin_token: adminToken });
      try { localStorage.removeItem("admin:" + id); } catch {}
      app.innerHTML = `<h1>削除しました</h1><p class="sub">LINEグループには中止をお知らせしました。</p>`;
    } catch (err) { msg.innerHTML = `<div class="notice error">${esc(err.message)}</div>`; e.target.disabled = false; }
  };
}

(params.get("e") ? renderEvent(params.get("e")) : renderCreate()).catch((e) => {
  app.innerHTML = `<div class="notice error">読み込みに失敗しました: ${esc(e.message)}</div>`;
});
</script>
</body>
</html>
